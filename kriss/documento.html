<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#f2f2f2;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#222}
  .card{width:100%;max-width:340px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:24px 20px}
  h1{font-size:17px;font-weight:600;margin-bottom:16px}
  label{display:block;font-size:13px;color:#555;margin-bottom:6px}
  input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #bbb;border-radius:4px;outline:none;background:#fff;color:#222}
  input:focus{border-color:#555}
  button{width:100%;margin-top:14px;font:inherit;font-size:16px;padding:11px;border:0;border-radius:4px;background:#333;color:#fff;cursor:pointer}
  .oso{display:block;width:min(180px,50vw);margin:0 auto 12px;overflow:visible}
  #cuerpo,#cabeza,#ojos,#orejaI,#orejaD,#brazoI,#brazoD,.oso{transform-box:fill-box}
  .oso{transform-origin:50% 100%;animation:respira 3.2s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
  #cabeza{transform-origin:50% 90%;animation:ladea 5s ease-in-out infinite;transition:transform .3s}
  @keyframes ladea{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
  #ojos{transform-origin:50% 50%;animation:parpadea 4.5s infinite}
  @keyframes parpadea{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  #orejaI{transform-origin:80% 90%;animation:oreja 3.6s ease-in-out infinite}
  #orejaD{transform-origin:20% 90%;animation:oreja 3.6s ease-in-out infinite reverse}
  @keyframes oreja{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-12deg)}94%{transform:rotate(6deg)}}
  #brazoI,#brazoD{transition:transform .45s cubic-bezier(.4,1.6,.5,1)}
  #brazoI{transform-origin:50% 90%}
  #brazoD{transform-origin:50% 90%;animation:saluda 4s ease-in-out infinite}
  @keyframes saluda{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(8deg)}}
  .tapa #brazoI{transform:translate(56px,-110px) rotate(-10deg)}
  .tapa #brazoD{animation:none;transform:translate(-54px,-70px) rotate(10deg)}
  .tapa #ojos{animation:none}
  .tapa #cabeza{animation:none;transform:rotate(0)}
  .no #cabeza{animation:niega .5s ease-in-out}
  @keyframes niega{25%{transform:rotate(-9deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-5deg)}}
  .feliz{animation:brinca .5s ease-in-out 2}
  @keyframes brinca{50%{transform:translateY(-14px)}}
  .feliz #brazoD{animation:saluda .5s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .msg{min-height:18px;margin-top:12px;font-size:13px;color:#b00020}
</style>
</head>

/* SHA-256 */
var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
var W=new Uint32Array(64);
function sha256(m){
  var l=m.length, nb=((l+9+63)>>6)<<6, b=new Uint8Array(nb);
  b.set(m); b[l]=0x80; var bits=l*8;
  b[nb-4]=bits>>>24; b[nb-3]=(bits>>>16)&255; b[nb-2]=(bits>>>8)&255; b[nb-1]=bits&255;
  b[nb-5]=Math.floor(bits/4294967296)&255;
  var h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  for(var o=0;o<nb;o+=64){
    for(var t=0;t<16;t++) W[t]=(b[o+4*t]<<24)|(b[o+4*t+1]<<16)|(b[o+4*t+2]<<8)|b[o+4*t+3];
    for(t=16;t<64;t++){
      var x=W[t-15], y=W[t-2];
      var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      var s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      W[t]=(W[t-16]+s0+W[t-7]+s1)|0;
    }
    var a=h0,bb=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
    for(t=0;t<64;t++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var t1=(h+S1+((e&f)^(~e&g))+K[t]+W[t])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var t2=(S0+((a&bb)^(a&c)^(bb&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0;
    }
    h0=(h0+a)|0;h1=(h1+bb)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0;h5=(h5+f)|0;h6=(h6+g)|0;h7=(h7+h)|0;
  }
  var r=new Uint8Array(32),hs=[h0,h1,h2,h3,h4,h5,h6,h7];
  for(var i=0;i<8;i++){r[4*i]=hs[i]>>>24;r[4*i+1]=(hs[i]>>>16)&255;r[4*i+2]=(hs[i]>>>8)&255;r[4*i+3]=hs[i]&255;}

function cat(a,b){var r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r;}
function hex2(s){var r=new Uint8Array(s.length/2);for(var i=0;i<r.length;i++)r[i]=parseInt(s.substr(2*i,2),16);return r;}
function tohex(a){var s="";for(var i=0;i<a.length;i++)s+=(a[i]<16?"0":"")+a[i].toString(16);return s;}
function utf8(s){return new TextEncoder().encode(s);}
function normaliza(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g," ");}

function abrir(pw){
  var salt=hex2(SALT), k=sha256(cat(salt,utf8(pw)));
  for(var i=0;i<ITER;i++) k=sha256(cat(k,salt));
  if(tohex(sha256(cat(k,utf8("check")))).slice(0,16)!==CHECK) return null;
  var bin=atob(DATA), n=bin.length, out=new Uint8Array(n), ctr=new Uint8Array(4), ks;
  for(var p=0;p<n;p++){
    if(p%32===0){var blk=p/32;ctr[0]=blk>>>24;ctr[1]=(blk>>>16)&255;ctr[2]=(blk>>>8)&255;ctr[3]=blk&255;ks=sha256(cat(k,ctr));}
    out[p]=bin.charCodeAt(p)^ks[p%32];
  }
  return new TextDecoder("utf-8").decode(out);
}

var msg=document.getElementById("msg"), oso=document.getElementById("oso"), pwEl=document.getElementById("pw");
function tapar(){ oso.classList.toggle("tapa", pwEl.value.length>0); }
pwEl.addEventListener("input",tapar);
pwEl.addEventListener("focus",tapar);
pwEl.addEventListener("blur",function(){ oso.classList.remove("tapa"); });
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var pw=normaliza(document.getElementById("pw").value);
  msg.textContent="";
  setTimeout(function(){
    var html=abrir(pw);
    if(!html){ msg.textContent="Contraseña incorrecta.";
      oso.classList.remove("tapa","no"); void oso.getBoundingClientRect(); oso.classList.add("no");
      setTimeout(function(){ oso.classList.remove("no"); tapar(); },550); return; }
    pwEl.blur(); oso.classList.remove("tapa"); oso.classList.add("feliz");
    setTimeout(function(){ document.open(); document.write(html); document.close(); },1100);
  },30);
});
